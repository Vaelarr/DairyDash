<!-- Branded Waiting Screen when loading products (Skeleton cards + Original DD badge) -->
<div class="catalog-waiting-state" *ngIf="service.loading()" role="status" aria-label="Loading products">
  <div class="waiting-card">
    <div class="logo-badge-container">
      <div class="logo-pulse-ring" aria-hidden="true"></div>
      <div class="original-logo-badge original-dd-badge" aria-hidden="true">
        <span class="dd-mark-text">DD</span>
      </div>
    </div>

    <h3 class="waiting-title">Loading fresh favorites…</h3>
    <p class="waiting-subtitle">Getting today's dairy picks ready for you</p>

    <div class="waiting-progress-track" aria-hidden="true">
      <div class="waiting-progress-fill"></div>
    </div>
  </div>

  <!-- Skeleton preview grid -->
  <div class="skeleton-preview-grid" aria-hidden="true">
    <div class="skeleton-preview-card" *ngFor="let i of [1, 2, 3, 4]">
      <div class="skeleton-thumb"></div>
      <div class="skeleton-line skeleton-title"></div>
      <div class="skeleton-line skeleton-price"></div>
    </div>
  </div>
</div>

<!-- Branded Error State with retry -->
<div class="catalog-error-state" *ngIf="service.error() && !service.loading()" role="alert">
  <div class="error-badge">
    <div class="original-logo-badge original-dd-badge error-dd-badge" aria-hidden="true">
      <span class="dd-mark-text">DD</span>
    </div>
  </div>
  <div class="error-text">
    <h4>Unable to load products</h4>
    <p>{{ service.error() }}</p>
  </div>
  <button
    type="button"
    class="retry-action-btn"
    (click)="service.refresh()"
    [disabled]="service.loading()"
  >
    Try again
  </button>
</div>
