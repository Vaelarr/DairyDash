<div
  class="splash-screen"
  [class.is-closing]="isClosing()"
  (click)="dismiss()"
  role="dialog"
  aria-modal="true"
  aria-label="Dairy Dash Loading Screen"
>
  <!-- Ambient floating milk bubbles -->
  <div class="ambient-bubbles" aria-hidden="true">
    <span class="bubble bubble-1"></span>
    <span class="bubble bubble-2"></span>
    <span class="bubble bubble-3"></span>
    <span class="bubble bubble-4"></span>
    <span class="bubble bubble-5"></span>
  </div>

  <div class="splash-card" (click)="$event.stopPropagation()">
    <!-- Animated Original Brand Badge -->
    <div class="brand-badge-container">
      <div class="badge-glow-ring" aria-hidden="true"></div>
      <div class="brand-badge original-dd-badge">
        <img src="assets/logo.png" alt="Dairy Dash" class="splash-logo-img" />
      </div>
    </div>

    <!-- App Title & Tagline -->
    <h1 class="brand-title">Dairy Dash</h1>
    <p class="brand-tagline">Fresh dairy delivered to your door</p>

    <!-- Value proposition pills -->
    <div class="brand-highlights" aria-hidden="true">
      <span class="highlight-pill">🥛 Farm Fresh</span>
      <span class="highlight-pill">⚡ Express</span>
      <span class="highlight-pill">🌿 100% Pure</span>
    </div>

    <!-- Progress indicator -->
    <div class="progress-section" aria-live="polite">
      <div class="progress-bar-track">
        <div class="progress-bar-fill"></div>
      </div>
      <p class="loading-label">Preparing your fresh experience…</p>
    </div>

    <!-- Tap to skip -->
    <button
      type="button"
      class="skip-hint"
      (click)="dismiss()"
      aria-label="Skip splash screen"
    >
      Tap anywhere to skip
    </button>
  </div>
</div>
