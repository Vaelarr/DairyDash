<ion-menu contentId="main" type="overlay">
  <ion-content class="menu-content">
    <!-- Brand header -->
    <div class="menu-brand">
      <div class="menu-brand-mark" aria-hidden="true">
        DD
      </div>

      <div>
        <p class="menu-eyebrow">FRESH FROM THE FARM</p>
        <h1>Dairy Dash</h1>
      </div>
    </div>

    <!-- User profile -->
    <section class="menu-profile" aria-label="User information">
      <div class="profile-avatar">
        @if (user().image && !profileImageFailed()) {
          <img
            [src]="user().image"
            [alt]="user().name + ' profile photo'"
            (error)="profileImageFailed.set(true)"
          />
        } @else {
          <ion-icon
            name="person-outline"
            aria-hidden="true"
          ></ion-icon>
        }
      </div>

      <div class="profile-details">
        <p class="profile-eyebrow">MY PROFILE</p>

        <h2>{{ user().name }}</h2>

        <p class="profile-phone">
          <ion-icon
            name="person-outline"
            aria-hidden="true"
          ></ion-icon>

          <span>{{ user().email }}</span>
        </p>
      </div>
    </section>

    <!-- Existing menu links -->
    <ion-list id="inbox-list">
      <ion-list-header>Menu</ion-list-header>

      @for (p of visiblePages(); track p.url) {
        <ion-menu-toggle [autoHide]="false">
          <ion-item
            [routerLink]="[p.url]"
            routerDirection="root"
            lines="none"
            [detail]="false"
            routerLinkActive="selected"
            [routerLinkActiveOptions]="{ exact: true }"
            ariaCurrentWhenActive="page"
          >
            <ion-icon
              aria-hidden="true"
              slot="start"
              [name]="p.icon"
            ></ion-icon>

            <ion-label>{{ p.title }}</ion-label>
          </ion-item>
        </ion-menu-toggle>
      }
    </ion-list>

    <ion-note class="menu-footer">
      Fresh ideas, thoughtfully made.
    </ion-note>
  </ion-content>
</ion-menu>
